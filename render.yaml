services:
  - type: web
    name: kodokodo-rewards-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: kodokodo-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: kodokodo-db
    plan: free
